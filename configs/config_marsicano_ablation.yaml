# Marsicano 2^3 multiphysics ablation study.
#
# The DEM, release polygon, released volume, grid, rheology, final time and
# boundary conditions remain identical in every run. Only the numerical order
# and the activation state of erosion, deposition and segregation change.
#
# Running:
#   python marsicano_ablation.py
#
# produces 8 first-order + 8 second-order simulations and continuously updates:
#   outputs/Marsicano_Ablation/marsicano_ablation_results.csv
# Each run also receives the normal final PNG maps produced by a normal
# simulation: depth, speed, Cartesian x/y velocity, local downslope/cross-slope
# velocity, density, solid fraction, coarse fraction and segregation.

compute:
  backend: cuda
  cpu_threads: 0
  cuda_device: 0
  cuda_block_x: 16
  cuda_block_y: 16
  cuda_threads_1d: 256
  cuda_allow_fallback: true
  cuda_sync_each_step: false

grid:
  dem_path: "../data/w46090_s10_Marsicano_UTM33_5m.asc"
  zip_member: null
  cache_path: "../cache/dem_cache_marsicano/dem_marsicano_ascii_dx5.npz"
  target_dx: 5.0
  clip_enabled: true
  xmin: 403000.0
  xmax: 409000.0
  ymin: 4625500.0
  ymax: 4629500.0
  min_valid_fraction: 0.5
  nodata_barrier_m: 100.0

numerics:
  g: 9.81
  # A common CFL is used for both orders so the ablation changes only the
  # requested discretization order and the active physical operators.
  cfl: 0.1
  dt_max: 0.1
  t_end: 275.0
  output_dt: 275.0
  h_dry: 1.0e-3
  # These two values are overwritten by the order matrix under `ablation`.
  space_order: 1
  time_order: 1
  limiter: mc
  flux: hllc
  hllc_fallback_hll: true
  hllc_dry_factor: 10.0
  hllc_max_froude: 8.0
  hybrid_depth_rel_jump: 0.75
  max_step_retries: 15
  positivity_tolerance: 1.0e-10
  speed_cap_ms: 80.0
  bc_left: outflow
  bc_right: outflow
  bc_bottom: outflow
  bc_top: outflow

material:
  # A real two-phase, two-class mixture is required here. The propagation-only
  # Marsicano comparison used solid_fraction=0, which would make deposition and
  # segregation inactive in practice even when their switches were enabled.
  rho_fluid: 1000.0
  rho_solid: 2650.0
  initial_solid_fraction: 0.55
  initial_coarse_fraction: 0.40
  initial_upper_solid_fraction: 0.50
  max_solid_fraction: 0.68

  # Equal fine/coarse resistance isolates the direct effects of bed exchange
  # and internal segregation from composition-dependent basal resistance.
  mu_fine: 0.17
  mu_coarse: 0.17
  xi_fine: 150.0
  xi_coarse: 150.0

  yield_N0_pa: 0.0
  grain_diameter_fine_m: 0.002
  grain_diameter_coarse_m: 0.05
  kinematic_viscosity_m2s: 1.0e-6

friction:
  interactive: false
  region_1_mu: 0.17
  region_1_xi: 150.0
  region_2_mu: 0.17
  region_2_xi: 150.0
  regions: []

release:
  enabled: true
  mode: polygon
  polygon:
    - [405551.6950280073, 4628148.722233832]
    - [405399.9539249785, 4627996.981130803]
    - [405399.9539249785, 4627725.111654543]
    - [405728.7263148742, 4627390.016718688]
    - [405987.95069921506, 4627257.243253537]
    - [406063.82125072944, 4627611.305827271]
    - [406076.4663426485, 4627889.497849491]
    - [405937.3703315388, 4628015.948768682]
    - [405747.6939527528, 4627813.627297977]
  volume_m3: 1200000.0
  center_x: 0.0
  center_y: 0.0
  radius_x: 400.0
  radius_y: 500.0
  solid_fraction: 0.55
  coarse_fraction: 0.40
  initial_speed_ms: 0.0
  direction_deg: 0.0
  interactive_polygon: false

erosion:
  # The enabled flag is overwritten for each ablation case.
  enabled: false
  model: excess_shear
  erodible_depth_m: 0.50
  bed_porosity: 0.40
  bed_coarse_fraction: 0.45
  critical_shear_pa: 2000.0
  excess_shear_rate_ms: 2.5e-5
  excess_shear_exponent: 1.0
  max_erosion_rate_ms: 0.01
  velocity_erosion_coefficient: 0.001
  potential_depth_per_kpa: 0.10
  erosion_velocity_ms: 0.025
  entrainment_velocity_fraction: 0.0
  # This must remain true also in deposition-only cases, because the current
  # conservative source operator uses this common switch for bed elevation.
  update_bed: true

deposition:
  # The enabled flag is overwritten for each ablation case.
  enabled: false
  critical_shear_pa: 500.0
  hindered_settling_exponent: 4.65
  max_rate_ms: 0.05
  minimum_mobile_depth_m: 0.005

segregation:
  # The enabled flag is overwritten for each ablation case.
  enabled: false
  segregation_length_m: 0.01
  max_segregation_speed_ms: 0.20
  remix_diffusivity_m2s: 1.0e-4
  min_layer_thickness_m: 0.01

output:
  # Each run receives its own subdirectory below ablation.output_root.
  out_dir: "../outputs/Marsicano_Ablation"
  save_snapshots: false
  make_png: false
  make_gif: false
  gif_fps: 12
  progress_every_steps: 50
  use_hillshade: true
  hillshade_alpha: 0.28
  save_setup_preview: false


# Reviewer-requested real-topography grid-sensitivity experiment.
# This deliberately coarsens the native 5 m DEM to 10 and 20 m and compares
# those solutions with the finest physically supported 5 m solution. No grid
# below 5 m is permitted because interpolation would not add terrain information.
grid_sensitivity:
  base_config: "config_marsicano.yaml"
  output_root: "../outputs/Marsicano_Ablation/grid_sensitivity"
  spacings_m: [20.0, 15.0, 10.0, 8.0, 6.5, 5.0]
  order: 2
  t_end_s: 275.0
  wet_threshold_m: 0.01
  make_final_png: true

# This top-level section is consumed by marsicano_ablation.py and is ignored
# by the normal solver configuration loader.
ablation:
  output_root: "../outputs/Marsicano_Ablation"
  csv_name: "marsicano_ablation_results.csv"
  wet_threshold_m: 0.01
  resume_completed: true
  make_final_png: true
  overwrite_final_png: false

  orders:
    - id: O1
      name: first_order
      space_order: 1
      time_order: 1
    - id: O2
      name: second_order
      space_order: 2
      time_order: 2

  # Full 2^3 factorial matrix: E=erosion, D=deposition, S=segregation.
  cases:
    - id: P000
      name: propagation_only
      erosion: false
      deposition: false
      segregation: false
    - id: E100
      name: erosion_only
      erosion: true
      deposition: false
      segregation: false
    - id: D010
      name: deposition_only
      erosion: false
      deposition: true
      segregation: false
    - id: S001
      name: segregation_only
      erosion: false
      deposition: false
      segregation: true
    - id: ED110
      name: erosion_deposition
      erosion: true
      deposition: true
      segregation: false
    - id: ES101
      name: erosion_segregation
      erosion: true
      deposition: false
      segregation: true
    - id: DS011
      name: deposition_segregation
      erosion: false
      deposition: true
      segregation: true
    - id: EDS111
      name: full_multiphysics
      erosion: true
      deposition: true
      segregation: true
