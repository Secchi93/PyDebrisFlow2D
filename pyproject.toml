[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydebrisflow2d"
version = "1.4.0"
description = "A conservative Python finite-volume research solver for variable-density debris flows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Mauricio Secchi"}
]
keywords = [
  "debris-flow",
  "finite-volume",
  "shallow-water",
  "Voellmy",
  "OBrien-Julien",
  "CUDA",
  "geohazards"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "numba>=0.60",
  "numba-cuda[cu13]",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "imageio>=2.30",
  "rasterio>=1.3",
  "pyproj>=3.6"
]

[project.urls]
Homepage = "https://github.com/Secchi93/PyDebrisFlow2D"
Repository = "https://github.com/Secchi93/PyDebrisFlow2D"

[tool.setuptools.packages.find]
include = ["pydebrisflow*"]
